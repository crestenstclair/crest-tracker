name: Linux performance integration
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
jobs:
  linux-performance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install native app and SDL build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential clang cmake pkg-config
          libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          libasound2-dev libudev-dev libdbus-1-dev libpulse-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxss-dev libxtst-dev
          libwayland-dev libxkbcommon-dev
          libasound2-plugins xvfb xauth xdotool openbox dbus-x11
          pulseaudio pulseaudio-utils imagemagick fonts-dejavu-core
          zenity at-spi2-core python3-pyatspi xdg-desktop-portal xdg-desktop-portal-gtk
      - name: Test Linux app contracts
        run: cargo test --locked -p crest-tracker-app
      - name: Exercise embedded engines with the released library on Linux
        run: >-
          cargo test --locked --release -p crest-tracker-app synth::witness::performance
          -- --ignored --test-threads=1
      - name: Package and verify relocated shipping executable
        id: package
        run: python3 scripts/package_linux.py
      - name: Exercise relocated app through Linux UI and virtual audio
        run: |
          archive="target/linux-candidate/crest-tracker-linux-x86_64-$(git rev-parse --short=12 HEAD).tar.gz"
          crates/crest-synth/scripts/linux/with-desktop.sh /usr/bin/python3 scripts/linux_performance_smoke.py "$archive"
      - uses: actions/upload-artifact@v4
        # Retain a verified package even if the separate desktop witness fails.
        if: always() && steps.package.outcome == 'success'
        with:
          name: Crest-Tracker-Linux-development
          path: target/linux-candidate/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Crest-Tracker-Linux-desktop-evidence
          path: target/linux-desktop-evidence/
