name: Tracker and Synth workspace
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p crest-tracker
      - run: cargo clippy --locked -p crest-tracker --all-targets -- -D warnings
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - run: make lint
      - run: cargo test --locked -p crest-tracker-app
      - run: cargo test --locked -p crest-synth --lib
        working-directory: crates/crest-synth
      - run: cargo test --locked -p crest-synth --test scheduled_midi_rendering -- --test-threads=1
      - run: python3 crates/crest-synth/scripts/check_native_audio.py
      - run: >-
          cargo test --locked --release -p crest-tracker-app synth::witness:: -- --ignored --test-threads=1
      - run: python3 scripts/bundle_macos.py --release
      - uses: actions/upload-artifact@v4
        with:
          name: Crest-Tracker
          path: target/release/Crest Tracker.app
