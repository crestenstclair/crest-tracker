name: Linux desktop witness on existing package
on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful Linux performance integration run that uploaded the package
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the previously verified development package
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
        run: |
          test "$(gh run view "$PACKAGE_RUN" --json conclusion --jq .conclusion)" = success
          gh run download "$PACKAGE_RUN" -n Crest-Tracker-Linux-development -D target/linux-artifact
          (cd target/linux-artifact && sha256sum --quiet -c *.sha256)
      - name: Install virtual desktop and runtime dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libgtk-3-0t64 libwebkit2gtk-4.1-0 libasound2t64 libasound2-plugins
          xvfb xauth xdotool openbox dbus-x11 pulseaudio pulseaudio-utils
          imagemagick fonts-dejavu-core zenity at-spi2-core python3-pyatspi
          xdg-desktop-portal xdg-desktop-portal-gtk fuse3
      - name: Exercise the existing package with the current desktop witness
        run: |
          archives=(target/linux-artifact/*.tar.gz)
          test "${#archives[@]}" = 1
          crates/crest-synth/scripts/linux/with-desktop.sh /usr/bin/python3 scripts/linux_performance_smoke.py "${archives[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Crest-Tracker-Linux-desktop-evidence
          path: target/linux-desktop-evidence/
