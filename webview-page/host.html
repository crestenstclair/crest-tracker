<section id="tracker-root" aria-label="Crest Tracker">
  <header class="tracker-context"><strong>CREST TRACKER</strong><span class="spacer"></span><button data-view="song" class="tracker-tab selected">* SONG</button><button data-view="instruments" class="tracker-tab">INSTRUMENTS</button><button id="tracker-transport" data-request="play">STOPPED</button></header>
  <header class="tracker-identity"><span id="tracker-context-name">SONG</span><h1 id="tracker-title">/ UNTITLED</h1><span class="spacer"></span><span id="tracker-subtitle"></span></header>
  <main class="tracker-workspace">
    <nav id="tracker-actions" aria-label="Song actions"></nav>
    <nav id="tracker-grid-window" aria-label="Sequence row window" hidden></nav>
    <div id="tracker-grid" role="region" aria-label="Musical sequence"></div>
    <div id="tracker-settings" hidden></div>
    <div id="tracker-timeline-context" hidden><div id="tracker-timeline-source"></div><p id="tracker-timeline-notice"></p></div>
    <p id="tracker-selection" hidden></p>
    <p id="tracker-feedback-status" hidden></p>
    <p id="tracker-playback-fault" role="alert" hidden></p>
    <p id="tracker-status" role="status" aria-live="polite">Starting sound engine…</p>
  </main>
  <footer class="tracker-footer"><span id="tracker-breadcrumb">SONG</span><span class="spacer"></span><span id="tracker-hints">SHIFT ↑ Settings · SHIFT → Chain · ENTER Select · SPACE Play</span></footer>
</section>
<button id="tracker-return" data-view="song" hidden>SHIFT ↓ QUICK JUMP · 3 RETURN TO SONG</button>
<dialog id="tracker-dialog" aria-labelledby="tracker-dialog-title"><form id="tracker-form"><header><h2 id="tracker-dialog-title"></h2><button type="button" id="tracker-dialog-close">BACK</button></header><div id="tracker-fields"></div><p id="tracker-form-error" role="alert"></p><footer><button type="button" id="tracker-dialog-cancel">CANCEL</button><button type="submit">APPLY</button></footer></form></dialog>
