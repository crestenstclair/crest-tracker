[workspace]
members = ["crates/crest-tracker", "crates/crest-tracker-app", "crates/crest-synth"]
default-members = ["crates/crest-tracker-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
crest-tracker = { path = "crates/crest-tracker" }
crest-synth = { path = "crates/crest-synth" }
crest-performance-core = { git = "https://github.com/crestenstclair/crest-linnstrument", tag = "v0.1.0" }
crest-linnstrument = { git = "https://github.com/crestenstclair/crest-linnstrument", tag = "v0.1.0" }
crest-performance-testkit = { git = "https://github.com/crestenstclair/crest-linnstrument", tag = "v0.1.0" }

[profile.dev]
debug = "line-tables-only"

[profile.test]
opt-level = 3
debug = "line-tables-only"
incremental = false

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
